# 푸시·PR마다 백엔드 테스트(실제 Postgres 컨테이너로 동시성·마이그레이션까지), 프론트 빌드,
# 화면 E2E 테스트(백엔드·프론트를 띄우고 브라우저로 둘러보기·QR 체크인·휴대폰 인증 가입)를 돌린다
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test
        run: chmod +x gradlew && ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      # 로컬 docker-compose와 같은 DB (백엔드 개발 설정이 localhost:5433을 본다)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: storefit
          POSTGRES_USER: storefit
          POSTGRES_PASSWORD: storefit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U storefit -d storefit"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: chmod +x ../backend/gradlew
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
      - name: 실패하면 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
