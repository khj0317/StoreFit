# 하루에 한 번만 헬스 체크를 불러 서버와 DB를 깨운다.
# - Supabase 무료 플랜은 오래(약 7일) 쓰지 않으면 일시정지된다.
# - 서버가 깨어 있는 동안 밀린 노쇼 처리와 오늘의 알림(찾는 날·연체, 오전 10시 이후 하루 한 번)을 보낸다.
# 그 밖에는 서버(Render)가 잠들어 있다가 접속이 오면 깨어나고, 프론트엔드가 "서버를 깨우는 중" 안내를 보여준다.
name: Keep DB active

on:
  schedule:
    - cron: '5 1 * * *' # 매일 한국 시간 오전 10시 5분 (GitHub 사정에 따라 늦어질 수 있다)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: |
          # 잠들어 있었다면 깨어나는 데 1분 가까이 걸리므로 넉넉히 기다리고, 실패하면 두 번 더 시도한다
          # Render 서비스 이름을 바꿨다면 아래 주소도 함께 바꾼다
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            https://storefit-api.onrender.com/api/health
