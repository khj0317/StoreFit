spring:
  application:
    name: luggage-storage
  datasource:
    # Absolute path anchored on the user's home directory -- deliberately NOT a relative
    # path, since relative H2 file paths resolve against whatever the process's working
    # directory happens to be (different between a terminal `cd backend && ./gradlew
    # bootRun`, an IDE run configuration, or a packaged jar), which silently pointed each
    # launch at a different/empty database and looked like data loss on restart.
    url: jdbc:h2:file:${user.home}/.luggage-storage/luggage;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # Hibernate no longer mutates the schema. It only checks that the entities match
      # what's actually in the DB, and fails loudly (instead of silently) if they don't.
      # Schema changes now go through versioned Flyway migrations in db/migration --
      # ddl-auto: update used to try to auto-ALTER the table on every restart, and when a
      # new NOT NULL column was added to a table that already had rows (e.g. `username` on
      # `members`), the ALTER silently failed and Hibernate just logged a warning and kept
      # booting, leaving the live schema out of sync with the entities. Every later query
      # touching that column then broke, which looked like member data disappearing.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # db/migration-h2dev only fixes up old local H2 dev databases and uses H2-only ALTER
    # syntax; it's added here (not in the shared db/migration) so prod's MySQL never sees it.
    locations: classpath:db/migration,classpath:db/migration-h2dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # Overridable via env var so a real deployment doesn't ship with this dev-only value.
  secret: ${JWT_SECRET:dev-only-secret-key-change-this-before-deploying-to-production-1234567890}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Toss Payments' own published sandbox test key (safe to share, no real merchant/money attached).
# Overridable via env var -- set TOSS_SECRET_KEY to your real secret key from
# https://developers.tosspayments.com before going live.
toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
