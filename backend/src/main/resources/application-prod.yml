# Activate with SPRING_PROFILES_ACTIVE=prod. All values below must come from real
# environment variables -- unlike the dev defaults in application.yml, there are no
# fallbacks here, so a missing one fails startup loudly instead of silently deploying
# with a dev secret or pointing at the wrong database.
spring:
  datasource:
    # Supabase → Connect → Session pooler (포트 5432), 예:
    # jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-token-expiration-days: ${JWT_REFRESH_DAYS:14}

toss:
  secret-key: ${TOSS_SECRET_KEY}

# 배포 서버는 재시작하면 디스크가 초기화되므로 사진은 Supabase Storage에 저장한다
storage:
  type: ${STORAGE_TYPE:s3}

# 배포에서는 실제 문자를 보내고, 인증번호는 절대 응답에 담지 않는다
notification:
  provider: ${NOTIFICATION_PROVIDER:solapi}
  expose-code: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  demo:
    enabled: ${DEMO_ENABLED:true}
  # 솔라피 일일 발송 한도·충전금을 넘지 않게 인증 문자를 하루 이만큼만 보낸다
  verification:
    max-sends-per-ip-per-hour: ${VERIFICATION_MAX_PER_IP:10}
    daily-limit: ${VERIFICATION_DAILY_LIMIT:30}
