# 로컬 개발용 Postgres. 배포는 Supabase(DB·Storage) + Render(백엔드) + Vercel(프론트엔드)를 쓴다.
#   docker compose up -d
# FitMate의 Postgres가 5432를 쓰고 있어서 StoreFit은 5433으로 연다.
services:
  postgres:
    image: postgres:17-alpine
    container_name: storefit-postgres
    restart: unless-stopped # Docker Desktop이 다시 켜지면 자동으로 함께 켜진다
    environment:
      POSTGRES_DB: storefit
      POSTGRES_USER: storefit
      POSTGRES_PASSWORD: storefit
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefit -d storefit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
